<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElanMəkanı - Maşın, Mal-Qara və Kənd Təsərrüfatı Portalı</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
</head>
<body>

  <!-- HEADER / NƏVİQASİYA -->
  <header class="header">
    <div class="container header-content">
      <div class="logo">
        <span class="logo-icon">🚗🐄🌾</span>
        <div>
          <h1>ElanMəkanı</h1>
          <p class="logo-sub">İkinci əl maşınlar, mal-qara və kənd təsərrüfatı satış portalı</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="trash-btn" onclick="openTrashModal()" title="Zibil Qutusu">
          🗑️ Zibil Qutusu (<span id="trashCount">0</span>)
        </button>
        <button class="reset-btn" onclick="resetInitialData()" title="İlkin Bazanı Bərpa Et">
          🔄 İlkin Bazanı Bərpa Et
        </button>
        <button class="add-btn" onclick="openModal()">➕ Yeni Elan Ver</button>
        <div id="userSection">
          <button class="auth-btn" onclick="openAuthModal()">🔑 Giriş / Qeydiyyat</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ƏSAS MƏZMUN -->
  <main class="container main-content">

    <!-- AXTARIŞ VƏ KATEQORİYA FİLTƏRLƏRİ -->
    <section class="filter-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Marka, heyvan adı, kənd məhsulu və ya şəhər axtar..." oninput="filterCards()">
      </div>

      <div class="category-filters">
        <button class="filter-btn active" onclick="setCategory('all', this)">
          Bütün Elanlar (<span id="count-all">0</span>)
        </button>
        <button class="filter-btn" onclick="setCategory('car', this)">
          🚗 İkinci Əl Maşınlar (<span id="count-car">0</span>)
        </button>
        <button class="filter-btn" onclick="setCategory('animal', this)">
          🐄 Mal-Qara & Heyvanlar (<span id="count-animal">0</span>)
        </button>
        <button class="filter-btn" onclick="setCategory('farm', this)">
          🌾 Kənd Təsərrüfatı Məhsulları (<span id="count-farm">0</span>)
        </button>
      </div>
    </section>

    <!-- ELAN KARTLARI ŞƏBƏKƏSİ -->
    <section id="cardsGrid" class="cards-grid">
      <!-- Kartlar script.js vasitəsilə dinamik yüklənir -->
    </section>

    <!-- NƏTİCƏ TAPILMADI XƏBƏRDARLIĞI -->
    <div id="noResults" class="no-results" style="display: none;">
      <p>⚠️ Axtarışınıza uyğun heç bir elan tapılmadı.</p>
    </div>

  </main>

  <!-- MODAL: YENİ ELAN ƏLAVƏ ET -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>📢 Yeni Elan Əlavə Et</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="addForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label for="title">Elan Başlığı:</label>
          <input type="text" id="title" placeholder="Məsələn: Mercedes E200, İnək və ya Təbii Quba Alması" required>
        </div>

        <div class="form-group">
          <label for="category">Kateqoriya:</label>
          <select id="category" required>
            <option value="car">🚗 İkinci Əl Maşın</option>
            <option value="animal">🐄 Mal-Qara / Heyvan</option>
            <option value="farm">🌾 Kənd Təsərrüfatı Məhsulu</option>
          </select>
        </div>

        <div class="form-group">
          <label for="price">Qiymət (AZN):</label>
          <input type="text" id="price" placeholder="Məsələn: 15,500 AZN və ya 0.80 AZN/kg" required>
        </div>

        <div class="form-group">
          <label for="imageFileInput">Elan Şəkli:</label>
          <input type="file" id="imageFileInput" accept="image/*" onchange="convertImageToBase64(event)" style="margin-bottom: 8px; width: 100%;">
          <input type="text" id="image" placeholder="Şəkil URL-i və ya yuxarıdan fayl seçin">
          <small style="color: #666; font-size: 12px; display: block; margin-top: 4px;">
            📁 Kompüter və ya telefondan şəkil seçə, yaxud hazır şəkil keçidi daxil edə bilərsiniz.
          </small>
        </div>

        <div class="form-group">
          <label for="phone">WhatsApp Əlaqə Nömrəsi:</label>
          <input type="text" id="phone" placeholder="994501234567" required>
        </div>

        <div class="form-group">
          <label for="description">Ətraflı Məlumat:</label>
          <textarea id="description" rows="3" placeholder="Elan haqqında ətraflı yazın..." required></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="cancel-btn" onclick="closeModal()">Ləğv Et</button>
          <button type="submit" class="submit-btn">Əlavə Et</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: HESABA GİRİŞ / QEYDİYYAT -->
  <div id="authModalOverlay" class="modal-overlay">
    <div class="modal-box auth-box">
      <div class="modal-header">
        <h2 id="authTitle">🔑 Hesaba Giriş</h2>
        <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      </div>
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group" id="nameGroup" style="display: none;">
          <label for="userName">Adınız və Soyadınız:</label>
          <input type="text" id="userName" placeholder="Məsələn: Fidan Hüseynova">
        </div>

        <div class="form-group">
          <label for="userEmail">E-poçt Ünvanı:</label>
          <input type="email" id="userEmail" placeholder="numune@mail.ru" required>
        </div>

        <div class="form-group" style="position: relative;">
          <label for="userPassword">Şifrə:</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="userPassword" placeholder="Şifrənizi daxil edin" required style="width: 100%; padding-right: 40px;">
            <span id="togglePasswordBtn" onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; cursor: pointer; font-size: 18px; user-select: none;" title="Şifrəni Göstər/Gizlət">👁️</span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="cancel-btn" id="toggleAuthBtn" onclick="toggleAuthMode()">Qeydiyyatdan keç</button>
          <button type="submit" class="submit-btn" id="authSubmitBtn">Daxil Ol</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ZİBİL QUTUSU -->
  <div id="trashModalOverlay" class="modal-overlay">
    <div class="modal-box trash-box">
      <div class="modal-header">
        <h2>🗑️ Silinmiş Elanlar (Zibil Qutusu)</h2>
        <button class="close-btn" onclick="closeTrashModal()">&times;</button>
      </div>
      <div id="trashList" class="trash-list"></div>
      <div class="modal-actions" style="margin-top: 15px;">
        <button type="button" class="cancel-btn" onclick="closeTrashModal()">Bağla</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
